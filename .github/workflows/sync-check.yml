name: sync-check

# Automated quality gates for this repo (constitution Principle VIII):
#   1. bash -n on every shell script (syntax)
#   2. scripts/test-sync-managed.sh — end-to-end test of the managed-file mechanism
#      (sync-managed.sh + the dev.sh engine) in a scratch directory; see
#      specs/011-self-updating-managed-files/quickstart.md
#   3. scripts/check-sync.sh — guards against silent drift between this repo's
#      deliberate copy-pairs: bundled templates vs. root reference files, and the
#      parent skill folder vs. demo-app's installed copy (design-history D7/D8/D13)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Shell syntax
        run: bash -n scripts/*.sh .claude/skills/webapp-uat/scripts/*.sh .claude/skills/webapp-uat/templates/dev.sh
      - name: Managed-file mechanism test
        run: bash scripts/test-sync-managed.sh
      - name: Copy-pair drift guard
        run: bash scripts/check-sync.sh
