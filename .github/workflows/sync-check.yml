name: sync-check

# Automated quality gates for this repo (constitution Principle VIII, as far as a
# skill made of Markdown and shell can have them):
#   1. bash -n on every shell script, one file per invocation (bash -n a b c only
#      parses a; b and c become positional parameters)
#   2. shellcheck, advisory only (no local install to keep it at zero warnings yet)
#   3. scripts/test-sync-managed.sh — end-to-end test of the managed-file mechanism
#      (sync-managed.sh + the dev.sh engine) in a scratch directory; see
#      specs/011-self-updating-managed-files/quickstart.md
#   4. scripts/check-sync.sh — guards against silent drift between this repo's
#      deliberate copy-pairs: bundled templates vs. root reference files, and the
#      parent skill folder vs. demo-app's installed copy (design-history D7/D8/D13)
#   5. demo-app's own unit tests and type check (the one sub-project with code)
# No Markdown linter runs; spec-folder plans that mention one mean a manual pass.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Shell syntax (every script, individually)
        run: |
          set -e
          for f in scripts/*.sh .claude/skills/webapp-uat/scripts/*.sh \
                   .claude/skills/webapp-uat/templates/dev.sh .specify/scripts/bash/*.sh \
                   demo-app/run.sh demo-app/scripts/dev.sh; do
            bash -n "$f" && echo "ok   $f"
          done
      - name: shellcheck (advisory)
        continue-on-error: true
        run: shellcheck -S warning scripts/*.sh .claude/skills/webapp-uat/scripts/*.sh .claude/skills/webapp-uat/templates/dev.sh
      - name: Managed-file mechanism test
        run: bash scripts/test-sync-managed.sh
      - name: Copy-pair drift guard
        run: bash scripts/check-sync.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: demo-app/package-lock.json
      - name: demo-app unit tests + type check
        working-directory: demo-app
        run: |
          npm ci
          npx prisma generate
          npm test
          npx tsc --noEmit
